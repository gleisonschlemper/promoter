<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuários</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-4xl">
        <div class="bg-slate-800 rounded-2xl shadow-2xl overflow-hidden">

            <div class="p-6 border-b border-slate-700">
                <a href="index.html"
                    class="inline-flex items-center gap-3 px-3 py-3
                            bg-gradient-to-r from-purple-600 via-pink-500 to-cyan-500
                            text-white font-bold rounded-full
                            shadow-[0_0_20px_rgba(168,85,247,0.6)]
                            hover:scale-105 hover:shadow-[0_0_35px_rgba(236,72,153,0.8)]
                            transition-all duration-300">

                        <svg xmlns="http://www.w3.org/2000/svg"
                            class="w-5 h-5"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M15 19l-7-7 7-7" />
                        </svg>
                </a>
                <h1 class="text-2xl font-bold text-white">
                    Lista de Usuários
                </h1>
                <p class="text-slate-400 mt-1">
                    Usuários cadastrados no sistema
                </p>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-slate-700">
                        <tr>
                            <th class="px-6 py-4 text-center text-sm font-semibold text-white">
                                ID
                            </th>
                            <th class="px-6 py-4 text-center text-sm font-semibold text-white">
                                Nome
                            </th>
                        </tr>
                    </thead>

                    <tbody class="divide-y divide-slate-700"></tbody>
                </table>
            </div>

        </div>
    </div>

    <script src="src/supabase/db.js"></script>
    <script src="src/script/usuario.js"></script>
</body>
</html>
