<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar na lista</title>
    <link rel="stylesheet" href="src/css/style.css">

</head>
<body>

    <main class="login-box">

        </section>
    </main>
